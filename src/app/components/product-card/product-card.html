<div class="product-card" *ngIf="product">
  <button
    class="favorite-btn"
    [class.active]="isFavorite"
    (click)="toggleFavorite($event)"
    [title]="isFavorite ? 'Retirer des favoris' : 'Ajouter aux favoris'"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      [attr.fill]="isFavorite ? 'currentColor' : 'none'"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path
        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
      ></path>
    </svg>
  </button>

  <div class="image-container">
    <img [src]="product.image" [alt]="product.title" />
  </div>

  <div class="title">{{ truncateText(product.title, 25) }}</div>

  <div class="description">{{ truncateText(product.description, 50) }}</div>

  <div class="price-rating">
    <div class="price">DT {{ product.price.toFixed(2) }}</div>
    <div class="rating" *ngIf="product.rating">
      <span class="stars">⭐</span>
      <span class="rate">{{ product.rating.rate }}</span>
    </div>
  </div>

  <button class="btn-add" (click)="addToCart()">Ajouter au panier</button>

  <a [routerLink]="['/products', product.id]" class="btn-details">Voir les détails</a>
</div>
