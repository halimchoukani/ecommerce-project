<div class="header-icons">
  <a routerLink="/products" class="icon-item" aria-label="Produits">
    <svg
      fill="none"
      stroke="rgb(124, 131, 232)"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M3 7l9-4 9 4v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"
      />
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 21V11h6v10" />
    </svg>
    <span>Produits</span>
  </a>

  <a routerLink="/catalogue" class="icon-item" aria-label="Catégories">
    <svg
      fill="none"
      stroke="rgb(124, 131, 232)"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <rect
        x="3"
        y="3"
        width="8"
        height="8"
        rx="1"
        ry="1"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
      />
      <rect
        x="13"
        y="3"
        width="8"
        height="8"
        rx="1"
        ry="1"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
      />
      <rect
        x="3"
        y="13"
        width="8"
        height="8"
        rx="1"
        ry="1"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
      />
      <rect
        x="13"
        y="13"
        width="8"
        height="8"
        rx="1"
        ry="1"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
      />
    </svg>
    <span>Catégories</span>
  </a>

  <a routerLink="/favorites" class="icon-item" aria-label="Favoris">
    <svg
      fill="none"
      stroke="rgb(124, 131, 232)"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 10-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"
      />
    </svg>
    <span>Favoris</span>
    <span class="favorites-badge" *ngIf="favoritesCount > 0">{{ favoritesCount }}</span>
  </a>

  <a *ngIf="!isLoggedIn" routerLink="/login" class="icon-item" aria-label="Mon Compte">
    <svg
      fill="none"
      stroke="rgb(124, 131, 232)"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M5.121 17.804A9 9 0 1118.88 6.196 9 9 0 015.12 17.804z"
      />
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
      />
    </svg>
    <span>Connexion</span>
  </a>
  <a routerLink="/profile" class="icon-item">
    <div *ngIf="isLoggedIn" class="icon-item user-menu" aria-label="Mon Compte">
      <svg
        fill="none"
        stroke="rgb(124, 131, 232)"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M5.121 17.804A9 9 0 1118.88 6.196 9 9 0 015.12 17.804z"
        />
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
        />
      </svg>
      <span>{{ username }}</span>
    </div>
  </a>

  <a routerLink="/cart" class="icon-item" aria-label="Mon Panier">
    <svg
      fill="none"
      stroke="rgb(124, 131, 232)"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M3 3h2l.4 2M7 13h10l4-8H5.4"
      />
      <circle
        cx="10"
        cy="20"
        r="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
      />
      <circle
        cx="18"
        cy="20"
        r="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
      />
    </svg>
    <span>Mon Panier</span>
    <span class="cart-badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
  </a>

  <div
    class="mobile-menu-toggle"
    (click)="toggleMenu()"
    role="button"
    aria-label="Basculer le menu"
  >
    <span></span>
    <span></span>
    <span></span>
  </div>
</div>
