<div class="slider-container">
  <div class="slides"
       [style.transform]="'translateX(-' + currentIndex * 100 + '%)'"
       [style.transition]="isTransitioning ? 'transform 0.8s ease-in-out' : 'none'">
    <div class="slide" *ngFor="let image of carouselImages">
      <img [src]="image.src" [alt]="image.alt" />
    </div>
  </div>

  <button class="nav prev" (click)="prevSlide()">&#10094;</button>
  <button class="nav next" (click)="nextSlide()">&#10095;</button>

  <div class="dots">
    <span *ngFor="let image of images; let i = index"
          [class.active]="currentIndex === i + 1"
          (click)="goToSlide(i)">
    </span>
  </div>
</div>
