<div class="catalogue-container">
  <div class="catalogue-header">
    <h1>Nos produits</h1>
    <p>Explorez notre collection complète</p>
  </div>

  <div class="filter-section">
    <div class="category-filters">
      <button
        class="filter-btn"
        [class.active]="selectedCategory === 'all'"
        (click)="filterByCategory('all')"
      >
        Tous les produits
      </button>
      <button
        *ngFor="let category of categories"
        class="filter-btn"
        [class.active]="selectedCategory === category"
        (click)="filterByCategory(category)"
      >
        {{ category }}
      </button>
    </div>
  </div>

  <div class="loading-container" *ngIf="loading">
    <div class="loader"></div>
    <p>Chargement des produits...</p>
  </div>

  <div class="error-message" *ngIf="error">
    <p>{{ error }}</p>
  </div>

  <div class="products-grid" *ngIf="!loading && !error">
    <app-product-card *ngFor="let product of filteredProducts" [product]="product">
    </app-product-card>
  </div>

  <div class="no-products" *ngIf="!loading && !error && filteredProducts.length === 0">
    <p>Aucun produit trouvé dans cette catégorie.</p>
  </div>
</div>
